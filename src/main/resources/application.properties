
spring.application.name=planKaro

# Server settings
server.port=8082

# JWT configuration
jwt.secret=yourSecretKey  # Secret key for signing JWT
jwt.expiration=86400000  # JWT expiration time in milliseconds (1 day)

# Database configuration (example using MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/plankaro
spring.datasource.username=root
#spring.datasource.password=plankaro@2025
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Spring Security settings (optional, for debugging purposes)
spring.security.debug=true
spring.main.allow-bean-definition-overriding=true



